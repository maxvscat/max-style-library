<!doctype html>
<html><head><meta charset="utf-8">
<!-- 綜藝 Punch 上字風 樣張：1920×1080，網址加 ?s=1～?s=4 切場景。全部程式繪製，背景是用 CSS 假裝的「實拍畫面」。 -->
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#ffe600; --pink:#ff3ea5; --ink:#1d1230; --red:#e8262d; --white:#fff;
  --sub-bg:rgba(0,0,0,.62);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:"Noto Sans CJK TC","Noto Sans CJK HK",sans-serif}
.scene{position:absolute;inset:0;display:none;overflow:hidden}.scene.on{display:block}

/* ---------- 假實拍畫面 ---------- */
.cam{position:absolute;inset:0;filter:saturate(1.05)}
.cam .blur{position:absolute;inset:0;filter:blur(2px)}
.room{background:linear-gradient(180deg,#d9d2c6 0%,#cfc6b8 58%,#a88d6d 58%,#8f7458 100%)}
.kitchen{background:linear-gradient(180deg,#eef0ee 0%,#e3e6e3 50%,#c9ccc9 50%,#b7bab6 100%)}
.window{position:absolute;background:linear-gradient(180deg,#fffdf6,#f3efe2);box-shadow:0 0 120px 40px rgba(255,250,235,.55)}
.sofa{position:absolute;background:#7d8590;border-radius:40px 40px 18px 18px}
.sofa::after{content:"";position:absolute;left:-40px;right:-40px;bottom:-40px;height:150px;background:#6c737d;border-radius:30px}
.pillow{position:absolute;border-radius:24px}
.tiles{position:absolute;inset:0 0 50% 0;background-image:linear-gradient(#d5d8d5 2px,transparent 2px),linear-gradient(90deg,#d5d8d5 2px,transparent 2px);background-size:120px 70px;opacity:.8}
.hood{position:absolute;background:linear-gradient(180deg,#bfc3c6,#9fa4a8);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.counter{position:absolute;background:#f4f4f2;box-shadow:0 -6px 0 #dadbd8 inset}
.person{position:absolute}
.person .head{position:absolute;border-radius:50%}
.person .hair{position:absolute;border-radius:50% 50% 40% 40%}
.person .body{position:absolute;border-radius:120px 120px 30px 30px}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.35) 100%)}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay}

/* ---------- 常駐元素 ---------- */
.logo-corner{position:absolute;left:48px;top:40px;z-index:20;transform:rotate(-4deg)}
.logo-chip{display:inline-block;background:var(--pink);color:#fff;font-weight:900;font-size:58px;line-height:1;padding:12px 22px 14px;border-radius:14px;
  border:6px solid #fff;box-shadow:6px 8px 0 var(--ink);letter-spacing:.02em}
.logo-chip small{display:block;font-size:20px;letter-spacing:.3em;text-align:center;margin-top:4px;color:var(--yellow)}
.preview-tag{position:absolute;left:48px;top:44px;z-index:20;transform:rotate(-5deg)}
.preview-tag div{background:#fff;color:var(--pink);font-weight:900;font-size:60px;line-height:1.05;padding:10px 18px;border:6px solid var(--ink);
  box-shadow:8px 8px 0 var(--pink)}
.preview-tag div span{display:block;color:var(--ink)}

/* ---------- 一般對白字幕：黑底小白字 ---------- */
.sub{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:15;background:var(--sub-bg);color:#fff;
  font-weight:500;font-size:46px;letter-spacing:.04em;padding:8px 22px 10px;border-radius:4px;white-space:nowrap}

/* ---------- 花字：大字＋厚描邊＋位移陰影 ---------- */
.punch{position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);z-index:16;white-space:nowrap;font-weight:900;letter-spacing:.02em;
  -webkit-text-stroke:18px var(--ink);paint-order:stroke fill}
.punch.y{color:var(--yellow);text-shadow:0 0 0 transparent,10px 12px 0 var(--pink),10px 12px 0 var(--pink)}
.punch.rw{color:#fff;-webkit-text-stroke:18px var(--red);text-shadow:10px 12px 0 rgba(0,0,0,.55)}
.punch .ring{color:#fff}

/* ---------- 手寫吐槽 hashtag ---------- */
.hand{position:absolute;z-index:16;font-family:"LXGW WenKai TC",cursive;font-weight:700;color:#fff;font-size:76px;
  text-shadow:0 0 8px rgba(0,0,0,.6),3px 4px 0 rgba(0,0,0,.55);transform:rotate(-7deg);white-space:nowrap}
.hand-svg{position:absolute;z-index:16;overflow:visible}

/* ---------- 方括號段落標籤 ---------- */
.bracket{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:16;font-weight:900;font-size:118px;color:#fff;white-space:nowrap;
  -webkit-text-stroke:16px #000;paint-order:stroke fill;letter-spacing:.03em}
.bracket b{color:var(--yellow)}
.lines{position:absolute;inset:0;z-index:12}

/* ---------- 圓體資訊花字 / 地名卡 ---------- */
.info{position:absolute;z-index:16;font-family:"Huninn","Noto Sans CJK TC",sans-serif;font-weight:400;font-size:96px;white-space:nowrap;
  color:var(--yellow);-webkit-text-stroke:14px #b3121a;paint-order:stroke fill;text-shadow:8px 10px 0 rgba(0,0,0,.35)}

/* ---------- logo 卡 ---------- */
.card-logo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-3deg);text-align:center}
.card-logo .big{display:inline-block;background:var(--pink);color:#fff;font-weight:900;font-size:220px;line-height:1;padding:28px 54px 40px;border-radius:40px;
  border:14px solid #fff;box-shadow:18px 22px 0 var(--yellow)}
.card-logo .big small{display:block;font-size:60px;letter-spacing:.35em;color:var(--yellow);margin-top:6px;padding-left:.35em}
.card-title{position:absolute;left:0;right:0;top:73%;text-align:center;color:#fff;font-weight:900;font-size:84px;letter-spacing:.12em}
.card-title i{font-style:normal;color:var(--yellow);margin:0 .3em}
.burst{position:absolute;inset:0}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
</svg>

<!-- ============ 場景 1：冷開場＋大花字 ============ -->
<div class="scene" id="s1">
  <div class="cam room"><div class="blur">
    <div class="window" style="left:1180px;top:90px;width:560px;height:520px"></div>
    <div class="sofa" style="left:180px;top:470px;width:900px;height:200px"></div>
    <div class="pillow" style="left:260px;top:430px;width:170px;height:140px;background:#e2b14a"></div>
    <div class="pillow" style="left:820px;top:440px;width:150px;height:130px;background:#e9e3d8"></div>
    <div class="person" style="left:700px;top:230px">
      <div class="body" style="left:0;top:330px;width:520px;height:560px;background:#6f8fc9"></div>
      <div class="hair" style="left:95px;top:-10px;width:330px;height:360px;background:#2b1d16"></div>
      <div class="head" style="left:120px;top:40px;width:280px;height:330px;background:#f1c9a8"></div>
    </div>
  </div><div class="vig"></div><svg class="grain" width="1920" height="1080"><rect width="100%" height="100%" filter="url(#noise)"/></svg></div>

  <div class="preview-tag"><div>精彩<span>預告</span></div></div>
  <div class="punch y" style="bottom:120px;font-size:150px">這是一個<span class="ring">新的</span>頻道</div>
</div>

<!-- ============ 場景 2：一般對白＋手寫吐槽 ============ -->
<div class="scene" id="s2">
  <div class="cam room"><div class="blur">
    <div class="window" style="left:120px;top:80px;width:420px;height:460px"></div>
    <div class="sofa" style="left:980px;top:430px;width:860px;height:200px"></div>
    <div class="person" style="left:380px;top:300px">
      <div class="body" style="left:0;top:300px;width:560px;height:520px;background:#f2f2f2"></div>
      <div class="hair" style="left:120px;top:20px;width:300px;height:130px;background:#e9e9e9;border-radius:120px 120px 10px 10px"></div>
      <div class="head" style="left:140px;top:60px;width:260px;height:300px;background:#d8a888"></div>
    </div>
    <div class="person" style="left:1260px;top:380px">
      <div class="body" style="left:0;top:250px;width:420px;height:480px;background:#c9b8a4"></div>
      <div class="hair" style="left:90px;top:0;width:240px;height:300px;background:#20160f"></div>
      <div class="head" style="left:105px;top:40px;width:210px;height:250px;background:#efc7a6"></div>
    </div>
  </div><div class="vig"></div><svg class="grain" width="1920" height="1080"><rect width="100%" height="100%" filter="url(#noise)"/></svg></div>

  <div class="logo-corner"><div class="logo-chip">PUNCH!<small>頻道LOGO</small></div></div>
  <div class="hand" style="left:930px;top:260px">#爸爸很緊張</div>
  <svg class="hand-svg" style="left:860px;top:340px" width="160" height="120">
    <path d="M150 10 C 110 30, 70 50, 30 95" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" style="filter:drop-shadow(2px 3px 0 rgba(0,0,0,.5))"/>
    <path d="M30 95 l 34 -6 M30 95 l 8 -32" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" style="filter:drop-shadow(2px 3px 0 rgba(0,0,0,.5))"/>
  </svg>
  <div class="sub">這個褲子我可以現場剪</div>
</div>

<!-- ============ 場景 3：方括號標籤＋速度線＋資訊花字 ============ -->
<div class="scene" id="s3">
  <div class="cam kitchen"><div class="blur">
    <div class="tiles"></div>
    <div class="hood" style="left:700px;top:60px;width:520px;height:200px"></div>
    <div class="counter" style="left:0;top:640px;width:1920px;height:440px"></div>
    <div class="person" style="left:720px;top:250px">
      <div class="body" style="left:0;top:300px;width:480px;height:520px;background:#efe9e1"></div>
      <div class="hair" style="left:70px;top:0;width:340px;height:620px;background:#1c1411;border-radius:50% 50% 30% 30%"></div>
      <div class="head" style="left:125px;top:50px;width:230px;height:280px;background:#f3cfb3"></div>
    </div>
    <div style="position:absolute;left:520px;top:560px;width:480px;height:120px;background:#3a3a3a;border-radius:0 0 240px 240px"></div>
    <div style="position:absolute;left:880px;top:430px;width:40px;height:220px;background:#e08a3c;border-radius:20px;transform:rotate(-30deg)"></div>
  </div><div class="vig"></div><svg class="grain" width="1920" height="1080"><rect width="100%" height="100%" filter="url(#noise)"/></svg></div>

  <svg class="lines" id="speed" width="1920" height="1080"></svg>
  <div class="logo-corner"><div class="logo-chip">PUNCH!<small>頻道LOGO</small></div></div>
  <div class="info" style="right:80px;top:120px;transform:rotate(4deg)">14天熟成和牛</div>
  <div class="bracket">[<b>大廚</b>上線]</div>
</div>

<!-- ============ 場景 4：黑底 logo 卡＋本集標題 ============ -->
<div class="scene" id="s4" style="background:#0b0b0d">
  <svg class="burst" id="burst" width="1920" height="1080"></svg>
  <div class="card-logo"><div class="big">PUNCH!<small>頻道LOGO</small></div></div>
  <div class="card-title">全員到齊<i>×</i>團圓飯大作戰</div>
</div>

<script>
const s = new URLSearchParams(location.search).get('s') || '1';
document.getElementById('s'+s).classList.add('on');

// 速度線（場景 3）
(function(){
  const g = document.getElementById('speed'); const cx=960, cy=520; let h='';
  for(let i=0;i<64;i++){
    const a = i/64*Math.PI*2 + (i%3)*0.02;
    const r1 = 520 + (i*37%9)*28, r2 = 1300;
    const w = 6 + (i*13%5)*4;
    const x1=cx+Math.cos(a)*r1, y1=cy+Math.sin(a)*r1, x2=cx+Math.cos(a)*r2, y2=cy+Math.sin(a)*r2;
    const nx=-Math.sin(a)*w, ny=Math.cos(a)*w;
    h += `<polygon points="${x1},${y1} ${x2+nx},${y2+ny} ${x2-nx},${y2-ny}" fill="#fff" opacity="${.55+(i%4)*.1}"/>`;
  }
  g.innerHTML = h;
})();

// logo 卡背後放射光（場景 4）
(function(){
  const g = document.getElementById('burst'); const cx=960, cy=475; let h='';
  for(let i=0;i<24;i++){
    const a0=i/24*Math.PI*2, a1=a0+Math.PI/24;
    h += `<polygon points="${cx},${cy} ${cx+Math.cos(a0)*1600},${cy+Math.sin(a0)*1600} ${cx+Math.cos(a1)*1600},${cy+Math.sin(a1)*1600}" fill="#1c1a22"/>`;
  }
  g.innerHTML = h;
})();
</script>
</body></html>
