<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg1:#f6f8fd;--bg2:#e7eef9;--grid:rgba(70,110,190,.10);--navy:#0f2a5c;--blue:#2e6be0;--blue-d:#1f4fbf;--blue-l:#a9c8fb;--pale:#dbe6f7;--ink:#13203a;--sub:#5b6680;--hl:#e8604c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:radial-gradient(ellipse at 45% 40%,var(--bg1) 0%,var(--bg2) 100%);font-family:"Noto Sans CJK TC",sans-serif;color:var(--ink)}
#grid,#art{position:absolute;inset:0}
.hud{position:absolute;z-index:5}
.chip{background:var(--blue);color:#fff;font-weight:900;font-size:26px;padding:8px 16px;border-radius:8px}
.ttl{font-weight:900;font-size:28px;margin-left:16px}
.sec{position:absolute;left:84px;top:112px;background:var(--navy);color:#fff;font-weight:900;font-size:32px;padding:14px 26px;border-radius:10px;z-index:5;display:none}
.sec b{font-weight:900;margin-right:18px;color:#8fb4ff}
.card{position:absolute;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(40,70,140,.12),0 2px 6px rgba(40,70,140,.08);z-index:4}
.lbl{padding:18px 26px;text-align:left}
.lbl small{display:block;color:var(--blue);font-weight:700;font-size:20px}
.lbl strong{display:block;font-weight:900;font-size:36px;line-height:1.25}
.lbl strong em{font-style:normal;color:var(--blue)}
.legend{width:640px;padding:26px 28px;display:flex;align-items:center;gap:22px}
.legend i{width:44px;height:44px;border-radius:8px;flex:none}
.legend .t{flex:1}.legend .t b{display:block;font-size:32px;font-weight:900}.legend .t span{color:var(--sub);font-size:21px}
.legend .n{text-align:right}.legend .n b{display:block;font-size:30px;font-weight:900}.legend .n span{color:var(--blue);font-size:27px;font-weight:700}
.sum{position:absolute;left:1130px;width:680px;padding:20px 26px;display:flex;align-items:center;gap:20px}
.sum .no{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.sum b{font-size:30px;font-weight:900}.sum span{display:block;color:var(--blue);font-size:20px;font-weight:700;margin-top:2px}
.pill{position:absolute;background:rgba(120,140,180,.35);color:#fff;font-weight:900;font-size:28px;padding:8px 22px;border-radius:30px;z-index:4}
.icon{position:absolute;width:84px;height:84px;background:#fff;border:3px solid var(--blue);border-radius:16px;box-shadow:0 6px 16px rgba(40,70,140,.15);display:flex;align-items:center;justify-content:center;z-index:4}
.icon.off{border-color:#cfdaee;opacity:.9}
.step{position:absolute;padding:12px 30px;text-align:center}
.step small{display:block;color:var(--blue);font-weight:700;font-size:20px}
.step strong{font-weight:900;font-size:30px}
.step.off{opacity:.45}
</style></head><body>
<svg id="grid" width="1920" height="1080"></svg>
<svg id="art" width="1920" height="1080"></svg>
<div class="hud" style="left:64px;top:40px;display:flex;align-items:center"><span class="chip">範例圖解</span><span class="ttl">一百份問卷 × 回購意願</span></div>
<div class="hud" style="right:64px;top:42px;text-align:right"><div style="font-weight:900;font-size:24px">樣張｜範例數據</div><div style="color:var(--sub);font-size:17px;margin-top:6px">數字僅示意風格，非真實調查</div></div>
<div class="sec" id="sec"></div>
<div id="ov"></div>
<script>
const C=Math.cos(Math.PI/6),S=.5;
const svgNS='http://www.w3.org/2000/svg';
function shade(h,f){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
// iso grid
(function(){const g=document.getElementById('grid');let s='';const step=64;
 for(let i=-40;i<60;i++){const x=i*step*C*2;
  s+=`<line x1="${x}" y1="0" x2="${x+1080/Math.tan(Math.PI/6)}" y2="1080" stroke="var(--grid)" stroke-width="1.2"/>`;
  s+=`<line x1="${x}" y1="0" x2="${x-1080/Math.tan(Math.PI/6)}" y2="1080" stroke="var(--grid)" stroke-width="1.2"/>`}
 g.innerHTML=s})();
let O={x:960,y:300},U=40;const boxes=[];
const P=(x,y,z)=>[O.x+(x-y)*C*U,O.y+(x+y)*S*U-z*U];
function box(x,y,z,w,d,h,top,opt={}){boxes.push({x,y,z,w,d,h,top,left:opt.left||shade(top,.86),right:opt.right||shade(top,.7),stroke:opt.stroke,o:{...O},u:U})}
function render(){const A=document.getElementById('art');
 boxes.sort((a,b)=>(a.x+a.y+a.z)-(b.x+b.y+b.z)||(a.z-b.z));
 let s='';for(const b of boxes){const o0=O,u0=U;O=b.o;U=b.u;const {x,y,z,w,d,h}=b;
  const poly=(pts,f)=>`<polygon points="${pts.map(p=>P(...p).join(',')).join(' ')}" fill="${f}" ${b.stroke?`stroke="${b.stroke}" stroke-width="1"`:''} stroke-linejoin="round"/>`;
  s+=poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],b.left);
  s+=poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],b.right);
  s+=poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],b.top);O=o0;U=u0}
 A.innerHTML=s}
function at(x,y,z){return P(x,y,z)}
function html(h){document.getElementById('ov').insertAdjacentHTML('beforeend',h)}
const plat=(x,y,w,d,h=.6)=>box(x,y,0,w,d,h,'#ffffff',{left:'#dfe8f6',right:'#c3d4ee'});
const ICON={
 walk:'<svg viewBox="0 0 48 48" width="46" fill="none" stroke="#2e6be0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="8" r="4"/><path d="M24 14l-4 12 6 6 2 10M20 26l-6 6M24 16l8 6 6-2"/></svg>',
 cart:'<svg viewBox="0 0 48 48" width="46" fill="none" stroke="#2e6be0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h6l5 22h22l4-15H13"/><circle cx="18" cy="38" r="3"/><circle cx="34" cy="38" r="3"/></svg>',
 star:'<svg viewBox="0 0 48 48" width="46" fill="none" stroke="#2e6be0" stroke-width="3.5" stroke-linejoin="round"><path d="M24 5l5.6 12 13 1.4-9.8 8.8 2.8 12.8L24 33.5 12.4 40l2.8-12.8L5.4 18.4l13-1.4z"/></svg>',
 chat:'<svg viewBox="0 0 48 48" width="46" fill="none" stroke="#2e6be0" stroke-width="3.5" stroke-linejoin="round"><path d="M6 10h36v22H20l-9 8v-8H6z"/></svg>',
 gift:'<svg viewBox="0 0 48 48" width="46" fill="none" stroke="#9fb3d6" stroke-width="3.5" stroke-linejoin="round"><rect x="7" y="18" width="34" height="22"/><path d="M5 12h38v6H5zM24 12v28M24 12c-4-8-12-6-10 0M24 12c4-8 12-6 10 0"/></svg>'};
const sec=(n,t)=>{const e=document.getElementById('sec');e.style.display='block';e.innerHTML=`<b>${n}</b>${t}`};

const sc=new URLSearchParams(location.search).get('s')||'1';
if(sc==='1'){ // 兩個平台＋連接路徑
 U=46;O={x:600,y:580};
 plat(0,0,6,6);box(1.2,1.2,.6,3.6,3.6,.35,'#1f4fbf');box(1.3,1.3,.95,3.4,3.4,.35,'#6f9bf0');box(1.2,1.2,1.3,3.6,3.6,.35,'#1f4fbf');box(1.3,1.3,1.65,3.4,3.4,.35,'#a9c8fb');
 box(6,2.2,0,6.5,1.6,.3,'#dbe6f7',{left:'#c7d6ee',right:'#b2c6e6'});box(10.9,-4.5,0,1.6,6.7,.3,'#dbe6f7',{left:'#c7d6ee',right:'#b2c6e6'});
 plat(9.5,-10,6,6);box(11.2,-8.6,.6,1.8,3.2,4.2,'#2e6be0');box(11.5,-8.3,4.8,1.2,2.2,.9,'#dbe6f7');box(13,-8.6,.6,1.6,3.2,1.8,'#dbe6f7');
 render();
 let p=at(3,3,4.2);html(`<div class="card lbl" style="left:${p[0]-140}px;top:${p[1]-150}px"><small>樣本</small><strong><em>100</em> 份問卷</strong></div>`);
 p=at(12.5,-7,7.2);html(`<div class="card lbl" style="left:${p[0]-120}px;top:${p[1]-140}px"><small>使用者</small><strong>最後決定</strong></div>`);
 p=at(9,3,.3);html(`<div class="pill" style="left:${p[0]-110}px;top:${p[1]-10}px">會回購嗎？</div>`);
}
if(sc==='2'){ // 方塊格陣＋圖例卡
 sec('一','問卷統計｜100 份');U=42;O={x:600,y:330};
 plat(-.8,-.8,11.6,11.6,.5);
 const cols=[];for(let i=0;i<100;i++){cols.push(i<42?'#2e6be0':i<77?'#a9c8fb':'#e4e8f0')}
 let k=0;for(let r=0;r<10;r++)for(let c=0;c<10;c++){const col=cols[k++];box(c*1.06,r*1.06,.5,.9,.9,.9,col,col==='#e4e8f0'?{left:'#d3d8e3',right:'#bcc3d2'}:{})}
 render();
 html(`<div class="card legend" style="left:1170px;top:200px"><i style="background:#2e6be0"></i><div class="t"><b>一定回購</b><span>已經推薦給朋友</span></div><div class="n"><b>42份</b><span>42%</span></div></div>`);
 html(`<div class="card legend" style="left:1170px;top:372px"><i style="background:#a9c8fb"></i><div class="t"><b>考慮回購</b><span>看價格和活動決定</span></div><div class="n"><b>35份</b><span>35%</span></div></div>`);
 html(`<div class="card legend" style="left:1170px;top:544px"><i style="background:#e4e8f0"></i><div class="t"><b>不會回購</b><span>有其他選擇</span></div><div class="n"><b>23份</b><span>23%</span></div></div>`);
 html(`<div class="card legend" style="left:1170px;top:716px;background:var(--blue);color:#fff"><div class="t"><b style="color:#fff">願意回購合計</b></div><div class="n"><b style="color:#fff;font-size:44px">77%</b></div></div>`);
}
if(sc==='3'){ // 之字形階梯流程
 sec('二','回購的五個理由');U=48;O={x:290,y:500};
 const st=[[0,0],[5,0],[5,-5],[10,-5],[10,-10],[15,-10],[15,-15]];
 const on=[1,1,1,1,0,0,0];
 for(let i=0;i<st.length-1;i++){const [a,b]=st[i],[c,d]=st[i+1];const t=on[i+1]?'#cfdcf2':'#eef2f9';
  if(c!==a) box(a+2.7,b+.9,0,c-a-2.7,.9,.25,t,{left:'#c4d3ee',right:'#b2c6e6'}); else box(c+.9,d+2.7,0,.9,b-d-2.7,.25,t,{left:'#c4d3ee',right:'#b2c6e6'})}
 st.forEach(([x,y],i)=>{const t=on[i]?'#2e6be0':i===4?'#dbe6f7':'#ffffff';box(x,y,0,2.7,2.7,.9,t,on[i]?{}:{left:'#dfe8f6',right:'#c3d4ee'})});
 render();
 const names=[['01','包裝好看'],['02','價格合理'],['03','口味穩定'],['04','客服回覆快'],['05','會員贈品']];
 const ic=['star','cart','walk','chat','gift','gift','gift'];
 st.forEach(([x,y],i)=>{const p=at(x+1.35,y+1.35,.9);
  const svg=on[i]?ICON[ic[i]]:ICON[ic[i]].replaceAll('#2e6be0','#9fb3d6');
  html(`<div class="icon ${on[i]?'':'off'}" style="left:${p[0]-42}px;top:${p[1]-120}px">${svg}</div>`);
  if(i<5){const top=i%2===0?p[1]-250:p[1]+70;html(`<div class="card step ${on[i]?'':'off'}" style="left:${p[0]-120}px;top:${top}px;width:240px"><small>${names[i][0]}</small><strong>${names[i][1]}</strong></div>`)}});
}
if(sc==='4'){ // 總結：積木＋編號卡
 sec('三','結論');U=40;O={x:560,y:450};
 plat(0,0,9,7);box(1,1,.6,1.6,4.6,4.6,'#2e6be0');box(2.6,1,.6,4.4,1.6,4.6,'#2e6be0');box(1,1,5.2,1.6,1.6,.8,'#dbe6f7');
 box(3.4,3.2,.6,3.2,2.6,1.4,'#dbe6f7');box(7.4,4.6,.6,.9,.9,.9,'#a9c8fb');box(7.6,1.2,.6,.8,.8,.8,'#a9c8fb');
 render();
 const items=[['1','近八成願意回購','包含考慮中的 35%'],['2','價格是最大變數','考慮回購者多半在等活動'],['3','包裝和口味最被肯定','前三名理由都和產品本身有關']];
 items.forEach((it,i)=>html(`<div class="card sum" style="top:${250+i*170}px"><div class="no">${it[0]}</div><div><b>${it[1]}</b><span>${it[2]}</span></div></div>`));
}
</script></body></html>
